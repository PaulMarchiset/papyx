[package]
name = "papyx"
version = "1.0.0"
description = "Papyx — local-only PDF toolbox"
authors = ["Paul Marchiset"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "papyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: the updater pulls in an HTTP client and `process` supplies the
# relaunch after an install. Neither exists on mobile targets, so they are
# gated here rather than behind a feature flag.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
